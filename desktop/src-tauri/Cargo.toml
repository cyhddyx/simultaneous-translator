[package]
name = "simultaneous-translator"
version = "0.1.0"
description = "Desktop simultaneous translation workspace"
authors = ["cyhddyx"]
edition = "2021"

[lib]
name = "simultaneous_translator_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The platform backend is opt-in: with no store feature keyring silently falls
# back to an in-process mock, so every saved key disappears on the next launch.
keyring = { version = "3", features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
